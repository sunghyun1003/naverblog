name: Verify approved editorial samples
on:
  push:
    paths: ["samples/**", "scripts/build-approved-samples.py", "scripts/test_approved_samples.py", ".github/workflows/approved-samples.yml"]
  pull_request:
    paths: ["samples/**", "scripts/build-approved-samples.py", "scripts/test_approved_samples.py", ".github/workflows/approved-samples.yml"]
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify DOCX extraction (no AI calls)
        run: python3 scripts/test_approved_samples.py
      - name: Compile read-only sample snapshot
        run: python3 scripts/build-approved-samples.py --output tmp/approved-samples.json
