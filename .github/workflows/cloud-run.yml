name: deploy-operational-dashboard

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dashboard-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE_NAME: naverblog-dashboard
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/naverblog-dashboard:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 검증
        run: npm ci && npm run verify

      - name: Google Cloud 인증
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github-actions"
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: 데이터베이스 마이그레이션·검증
        env:
          DATABASE_TEAM_ID: carrot-company
        run: |
          DIRECT_DATABASE_URL="$(gcloud secrets versions access latest --secret=dashboard-database-direct-url --project "${{ vars.GCP_PROJECT_ID }}")"
          DATABASE_URL="$DIRECT_DATABASE_URL"
          export DATABASE_URL
          npm run db:migrate
          npm run db:verify

      - name: Artifact Registry 로그인
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: 컨테이너 빌드·업로드
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Cloud Run 배포
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${{ vars.GCP_DASHBOARD_RUNTIME_SERVICE_ACCOUNT }}" \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "NODE_ENV=production,API_HOST=0.0.0.0,SERVE_WEB=true,WEB_ORIGIN=https://carrot-blog.web.app,AUTOMATION_PROVIDER=github,STORAGE_PROVIDER=postgres,DATABASE_TEAM_ID=carrot-company,DATABASE_POOL_MAX=3,DASHBOARD_SECURE_COOKIE=true,GITHUB_AUTOMATION_OWNER=sunghyun1003,GITHUB_AUTOMATION_REPOSITORY=naverblog-automation,GITHUB_AUTOMATION_BRANCH=main" \
            --set-secrets "DASHBOARD_USERNAME=dashboard-username:latest,DASHBOARD_PASSWORD=dashboard-password:latest,DASHBOARD_SESSION_SECRET=dashboard-session-secret:latest,GITHUB_AUTOMATION_TOKEN=github-automation-token:latest,DATABASE_URL=dashboard-database-url:latest"

      - name: 배포 주소
        run: gcloud run services describe "$SERVICE_NAME" --region "$REGION" --format='value(status.url)'
